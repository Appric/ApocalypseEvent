#ApocalypseEvent Config

enabled: true # Sets whether the plugin is enabled or not

undried-blocks: # List of blocks that can only be placed next to each other
  - DIRT
  - GRASS_BLOCK
  - MYCELIUM
fragile-blocks: # List of blocks that will not drop when mined
  - DIRT
  - COARSE_DIRT
  - ROOTED_DIRT
  - DIRT_PATH
  - FARMLAND
  - MYCELIUM
  - PODZOL

heat: true # Sets whether to use the heat mechanic
heat-threshold: 12 # Sets how much heat must be obtained before damaging

limit-death-messages: true # Sets whether to require players to be in a certain range to see death messages
death-message-range: 20 # The range death messages can be seen if enabled
limit-chat-messages: true # Sets whether to require players to be in a certain range to see chat messages
chat-message-range: 20 # The range chat messages can be seen if enabled

drop-dried-ghasts: true # Sets whether happy ghasts will drop dried ghasts when they die
drop-armor-to-fire: true # Sets whether players will drop their armor to a fire-related death
unbreaking-armor-craft: true # Sets whether armor will automatically get unbreaking I when crafted
limit-locator-bar: true # Sets whether the locator bar is only received by infected players
water-can-treat: true # Sets whether water in the treat-biome biome will treat a player under infection time, but before converting
treat-biome: "cherry_grove"

limit-water: false # Sets whether you can only place water next to undried blocks or not
deadly-water: true # Sets whether water in the map poisons/withers the player (except for the trat-biome biome if water-can-treat is enabled)
freezing-biomes:
  - snowy_taiga

infection: true # Sets whether to use the infection mechanics
infect-time: 300 # The time in seconds before a player is converted from infection
fire-only-death-infected: true # Sets whether fire-related damage is the only way for an infected player to die
less-infected-health: 2 # Sets how much maximum health infected players lose (in half-hearts so 2 is a full heart). Use 0 to disable.

custom-recipes: true # Sets whether to use the custom recipes
juice-duration: 60 # Sets the amount of seconds the juice effects last

lightning-storms: true # Sets whether rain/snow/thunder weather is switched to a more intense lightning storm
random-lightning: false # Sets whether to strike players at random (if false then it will strike all players exposed to the sky)
lightning-frequency: 5 # How often in seconds lightning will strike
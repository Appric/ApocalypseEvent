name: ApocalypseEvent
version: '${version}'

main: approt.apocalypseEvent.ApocalypseEvent
api-version: '26.3'

authors: [ approt ]

commands:
  apocalypseevent:
    description: The primary command for the ApocalypseEvent plugin.
    aliases: [ae, apoc, apocalypse]
    permission: apocalypseevent
    permission-message: You do not have permission to use that command!
    usage: "Incorrect usage! Example: /<command> parameter"

permissions:
  apocalypseevent:
    default: op
    description: Parent permission for all ApocalypseEvent permissions.
    children:
      apocalypseevent.reload:
        description: Allows players to reload the config with /apocalypseevent reload
      apocalypseevent.toggle:
        description: Allows players to enable and disable the plugin with /apocalypseevent toggle
      apocalypseevent.infect:
        description: Allows players to infect a player with /apocalypseevent infect
      apocalypseevent.cure:
        description: Allows players to cure an infected player with /apocalypseevent cure
      apocalypseevent.convert:
        description: Allows players to instantly convert a player to become infected with /apocalypseevent convert
      apocalypseevent.remedy:
        description: Allows a player to get the remedy item with /apocalypseevent remedy
      apocalypseevent.immunize:
        description: Allows a player to make a player immune with /apocalypseevent immunize
      apocalypseevent.deimmunize:
        description: Allows a player to make a player no longer immune with /apocalypseevent deimmunize